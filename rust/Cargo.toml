[package]
name = "steammobile-core"
version = "0.1.0"
edition = "2021"
description = "SteamMobile Core Library - PC game emulation for mobile devices"
authors = ["SteamMobile Team"]
license = "MIT OR Apache-2.0"

[lib]
name = "steammobile_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"

# Android/JNI bindings (when building for Android)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_log = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Concurrency
parking_lot = "0.12"

# Memory management
mmap = "0.1"

# Binary analysis
goblin = "0.7"

# Optional: For advanced JIT compilation
# llvm-sys = "150.0.0"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = true